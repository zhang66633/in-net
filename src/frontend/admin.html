<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>in-net 管理面板</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d37; --text: #e1e4ed; --muted: #8b8fa3; --accent: #6c8cff; --green: #4ade80; --red: #f87171; --yellow: #facc15; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .info { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; }
  .tab { padding: 12px 20px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .content { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-sm { padding: 3px 10px; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-green { background: rgba(74,222,128,.15); color: var(--green); }
  .badge-red { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-blue { background: rgba(108,140,255,.15); color: var(--accent); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 440px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 16px; font-size: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .mb16 { margin-bottom: 16px; }
  .mb24 { margin-bottom: 24px; }
  .mr8 { margin-right: 8px; }
  .text-muted { color: var(--muted); font-size: 13px; }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar input, .filter-bar select { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }
  .pagination { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 16px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); }
  .toast { position: fixed; top: 16px; right: 16px; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 300; animation: slideIn .3s ease; }
  .toast.success { background: rgba(74,222,128,.2); border: 1px solid var(--green); color: var(--green); }
  .toast.error { background: rgba(248,113,113,.2); border: 1px solid var(--red); color: var(--red); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body x-data="app()" x-init="init()">

  <template x-if="toast.show">
    <div :class="'toast ' + toast.type" x-text="toast.msg" @click="toast.show = false"></div>
  </template>

  <!-- Header -->
  <div class="header">
    <div>
      <h1>in-net 管理面板</h1>
      <span class="info" x-text="'代理: 127.0.0.1, 上游: ' + activeUpstreamName"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="text-muted" x-text="authChecked ? (authenticated ? '' : '🔒 需要登录') : ''"></span>
      <button class="btn btn-sm" @click="doLogout" x-show="authenticated">退出</button>
    </div>
  </div>

  <!-- 登录界面 -->
  <template x-if="!authenticated && authChecked">
    <div class="content" style="max-width:400px;margin-top:60px;">
      <div class="card">
        <h3 style="margin-bottom:16px;">管理员登录</h3>
        <div class="form-group">
          <label>密码</label>
          <input type="password" x-model="loginPw" @keydown.enter="doLogin" placeholder="请输入管理员密码">
        </div>
        <button class="btn btn-primary" @click="doLogin">登录</button>
        <p x-show="loginError" class="text-red" style="margin-top:8px;" x-text="loginError"></p>
      </div>
    </div>
  </template>

  <!-- 主界面 -->
  <template x-if="authenticated">
    <div>
      <div class="tabs">
        <button :class="'tab ' + (tab==='dashboard'?'active':'')" @click="tab='dashboard';loadTab()">📊 仪表盘</button>
        <button :class="'tab ' + (tab==='keys'?'active':'')" @click="tab='keys';loadTab()">🔑 API 密钥</button>
        <button :class="'tab ' + (tab==='upstreams'?'active':'')" @click="tab='upstreams';loadTab()">🌐 上游端点</button>
        <button :class="'tab ' + (tab==='models'?'active':'')" @click="tab='models';loadTab()">🤖 模型</button>
        <button :class="'tab ' + (tab==='logs'?'active':'')" @click="tab='logs';loadTab()">📋 日志</button>
      </div>

      <div class="content">

        <!-- ═══ 仪表盘 ═══ -->
        <template x-if="tab==='dashboard'">
          <div>
            <div class="cards">
              <div class="card"><div class="stat-label">请求总数</div><div class="stat-value" x-text="fmtNum(stats.totalRequests)"></div><div class="stat-sub" x-text="'时间范围: ' + statsPeriod"></div></div>
              <div class="card"><div class="stat-label">Token 总数</div><div class="stat-value" x-text="fmtNum(stats.totalTokens)"></div></div>
              <div class="card"><div class="stat-label">平均延迟</div><div class="stat-value" x-text="stats.avgLatencyMs + 'ms'"></div></div>
              <div class="card"><div class="stat-label">成功率</div><div class="stat-value" :class="stats.successRate >= 0.95 ? 'text-green' : 'text-red'" x-text="(stats.successRate * 100).toFixed(1) + '%'"></div></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div class="card">
                <div class="stat-label mb16">当前配置</div>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div><span class="text-muted">密钥：</span> <span class="mono" x-text="activeKeyName || '无'"></span></div>
                  <div><span class="text-muted">上游：</span> <span class="mono" x-text="activeUpstreamName || '无'"></span></div>
                  <div><span class="text-muted">负载均衡：</span> <span class="badge badge-blue" x-text="activeLoadBalancing === 'round-robin' ? '轮询' : '活跃'"></span></div>
                </div>
              </div>
              <div class="card">
                <div class="stat-label mb16">模型分布</div>
                <template x-if="stats.byModel && stats.byModel.length > 0">
                  <div>
                    <template x-for="m in stats.byModel" :key="m.model">
                      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                        <span class="mono" x-text="m.model"></span>
                        <span class="text-muted" x-text="m.count + ' 次, ' + fmtNum(m.tokens) + ' tokens'"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="!stats.byModel || stats.byModel.length === 0">
                  <div class="text-muted">暂无数据</div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- ═══ API 密钥 ═══ -->
        <template x-if="tab==='keys'">
          <div>
            <div class="flex-between mb16">
              <h3>API 密钥管理</h3>
              <button class="btn btn-primary" @click="openKeyModal()">+ 添加密钥</button>
            </div>
            <table x-show="keys.length > 0">
              <thead><tr><th>名称</th><th>密钥</th><th>关联上游</th><th>默认</th><th>备注</th><th style="width:220px;">操作</th></tr></thead>
              <tbody>
                <template x-for="k in keys" :key="k.id">
                  <tr>
                    <td x-text="k.name"></td>
                    <td><code x-text="k.key" style="font-size:12px;"></code></td>
                    <td class="text-muted" x-text="k.upstreamId || '-'"></td>
                    <td><span x-show="k.isDefault" class="badge badge-green">默认</span></td>
                    <td class="text-muted" x-text="k.notes || '-'" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
                    <td>
                      <button class="btn btn-sm mr8" @click="openKeyModal(k)">编辑</button>
                      <button class="btn btn-sm mr8" x-show="!k.isDefault" @click="setDefaultKey(k.id)">设默认</button>
                      <button class="btn btn-sm btn-danger" @click="deleteKey(k.id)">删除</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="keys.length === 0" class="empty">还没有 API 密钥，点击上方按钮添加。</div>
          </div>
        </template>

        <!-- ═══ 上游端点 ═══ -->
        <template x-if="tab==='upstreams'">
          <div>
            <div class="flex-between mb16">
              <h3>上游端点管理</h3>
              <button class="btn btn-primary" @click="openUpstreamModal()">+ 添加上游</button>
            </div>
            <table x-show="upstreams.length > 0">
              <thead><tr><th>名称</th><th>地址</th><th>绑定密钥</th><th>状态</th><th>活跃</th><th>操作</th></tr></thead>
              <tbody>
                <template x-for="u in upstreams" :key="u.id">
                  <tr>
                    <td x-text="u.name"></td>
                    <td class="mono" x-text="u.url" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></td>
                    <td class="text-muted" x-text="u.keyId ? (keys.find(k => k.id === u.keyId) || {}).name || u.keyId : '—'"></td>
                    <td><span :class="'status-dot ' + (upstreamStatus[u.id]?.ok ? 'online' : 'offline')"></span> <span class="text-muted" x-text="upstreamStatus[u.id]?.ok ? '在线' : (upstreamStatus[u.id] ? '离线' : '未检测')"></span></td>
                    <td><span x-show="u.isActive" class="badge badge-green">活跃</span></td>
                    <td>
                      <button class="btn btn-sm mr8" @click="openUpstreamModal(u)">编辑</button>
                      <button class="btn btn-sm mr8" x-show="!u.isActive" @click="activateUpstream(u.id)">启用</button>
                      <button class="btn btn-sm mr8" @click="testUpstream(u.id)">测试</button>
                      <button class="btn btn-sm btn-danger" @click="deleteUpstream(u.id)">删除</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="upstreams.length === 0" class="empty">还没有配置上游端点。</div>
          </div>
        </template>

        <!-- ═══ 模型 ═══ -->
        <template x-if="tab==='models'">
          <div>
            <div class="flex-between mb16">
              <h3>可用模型</h3>
              <button class="btn" @click="loadModels" :disabled="loadingModels">🔄 刷新</button>
            </div>
            <div x-show="loadingModels" class="loading">加载中...</div>
            <div x-show="!loadingModels && models.length > 0">
              <div class="filter-bar mb16">
                <input type="text" x-model="modelFilter" placeholder="搜索模型...">
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;">
                <template x-for="m in filteredModels" :key="m.id">
                  <div class="card" style="padding:14px;">
                    <div style="font-weight:600;font-size:14px;" x-text="m.id"></div>
                    <div class="text-muted" style="font-size:12px;" x-text="m.ownedBy"></div>
                    <code class="mono text-muted" x-text="'claude --model ' + m.id" style="display:block;margin-top:8px;"></code>
                  </div>
                </template>
              </div>
            </div>
            <div x-show="!loadingModels && models.length === 0" class="empty">没有找到模型，请检查上游配置。</div>
          </div>
        </template>

        <!-- ═══ 日志 ═══ -->
        <template x-if="tab==='logs'">
          <div>
            <h3 class="mb16">请求日志</h3>
            <div class="filter-bar">
              <input type="text" x-model="logFilter.model" placeholder="模型名称..." @keydown.enter="loadLogs()">
              <select x-model="logFilter.status" @change="loadLogs()">
                <option value="">全部状态</option>
                <option value="success">成功</option>
                <option value="error">失败</option>
              </select>
              <button class="btn" @click="loadLogs()">🔍 搜索</button>
            </div>
            <table x-show="logData.entries && logData.entries.length > 0">
              <thead><tr><th>时间</th><th>模型</th><th>流式</th><th>输入 Token</th><th>输出 Token</th><th>延迟</th><th>状态</th></tr></thead>
              <tbody>
                <template x-for="l in logData.entries" :key="l.id">
                  <tr style="cursor:pointer;" @click="l._open = !l._open">
                    <td class="text-muted mono" x-text="fmtTs(l.ts)"></td>
                    <td class="mono" x-text="l.model"></td>
                    <td x-text="l.stream ? '是' : '否'"></td>
                    <td x-text="l.inputTokens"></td>
                    <td x-text="l.outputTokens"></td>
                    <td x-text="l.latencyMs + 'ms'"></td>
                    <td><span :class="'badge ' + (l.status === 'success' ? 'badge-green' : 'badge-red')" x-text="l.status === 'success' ? '成功' : '失败'"></span></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="!logData.entries || logData.entries.length === 0" class="empty">暂无日志记录。</div>
            <div x-show="logData.total > 0" class="pagination">
              <button class="btn btn-sm" @click="logPage--;loadLogs()" :disabled="logPage <= 1">← 上一页</button>
              <span class="text-muted" x-text="'第 ' + logPage + ' / ' + Math.ceil(logData.total / logData.limit) + ' 页'"></span>
              <button class="btn btn-sm" @click="logPage++;loadLogs()" :disabled="!logData.hasMore">下一页 →</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- 密钥弹窗 -->
  <template x-if="showKeyModal">
    <div class="modal-overlay" @click.self="showKeyModal = false">
      <div class="modal">
        <h3 x-text="editingKey ? '编辑密钥' : '添加密钥'"></h3>
        <div class="form-group"><label>名称 *</label><input x-model="keyForm.name" placeholder="例如：我的 API Key"></div>
        <div class="form-group"><label>密钥值 *</label><input x-model="keyForm.key" :placeholder="editingKey ? '(留空则不修改)' : 'sk-...'"></div>
        <div class="form-group"><label>关联上游</label><select x-model="keyForm.upstreamId"><option value="">不限</option><template x-for="u in upstreams"><option :value="u.id" x-text="u.name"></option></template></select></div>
        <div class="form-group"><label>备注</label><textarea x-model="keyForm.notes" placeholder="可选备注..."></textarea></div>
        <div class="form-actions">
          <button class="btn" @click="showKeyModal = false">取消</button>
          <button class="btn btn-primary" @click="saveKey()">保存</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 上游弹窗 -->
  <template x-if="showUpstreamModal">
    <div class="modal-overlay" @click.self="showUpstreamModal = false">
      <div class="modal">
        <h3 x-text="editingUpstream ? '编辑上游' : '添加上游'"></h3>
        <div class="form-group"><label>名称 *</label><input x-model="upstreamForm.name" placeholder="例如：学校 New API"></div>
        <div class="form-group"><label>地址 *</label><input x-model="upstreamForm.url" placeholder="https://.../v1/chat/completions"></div>
        <div class="form-group"><label>绑定密钥</label><select x-model="upstreamForm.keyId"><option value="">使用全局活跃密钥</option><template x-for="k in keys" :key="k.id"><option :value="k.id" x-text="k.name"></option></template></select></div>
        <div class="form-actions">
          <button class="btn" @click="showUpstreamModal = false">取消</button>
          <button class="btn btn-primary" @click="saveUpstream()">保存</button>
        </div>
      </div>
    </div>
  </template>

<script>
function app() { return {
  authenticated: false, authChecked: false, loginPw: "", loginError: "",
  tab: "dashboard", toast: { show: false, msg: "", type: "success" },
  keys: [], upstreams: [], models: [], modelFilter: "",
  stats: { totalRequests: 0, totalTokens: 0, avgLatencyMs: 0, successRate: 0, byModel: [], byStatus: [] },
  statsPeriod: "24h",
  logData: { entries: [], total: 0, page: 1, limit: 50, hasMore: false },
  logPage: 1, logFilter: { model: "", status: "" },
  loadingModels: false, upstreamStatus: {},
  activeKeyId: "", activeKeyName: "", activeUpstreamId: "", activeUpstreamName: "", activeLoadBalancing: "",
  showKeyModal: false, editingKey: null, keyForm: { name: "", key: "", upstreamId: "", notes: "" },
  showUpstreamModal: false, editingUpstream: null, upstreamForm: { name: "", url: "", keyId: "" },

  async init() {
    await this.checkAuth();
    if (this.authenticated) { await this.loadBaseData(); this.loadTab(); }
  },
  async api(method, path, body) {
    const opts = { method, headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(path, opts);
    if (resp.status === 401) { this.authenticated = false; this.authChecked = true; return null; }
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    return resp.json();
  },
  async checkAuth() {
    try { const r = await this.api("GET", "/api/auth/status"); this.authenticated = r?.authenticated ?? false; }
    catch { this.authenticated = false; }
    this.authChecked = true;
  },
  async doLogin() {
    this.loginError = "";
    try {
      const r = await this.api("POST", "/api/auth/login", { password: this.loginPw });
      if (r?.authenticated) { this.authenticated = true; this.loginPw = ""; this.loadBaseData(); this.loadTab(); }
      else this.loginError = "登录失败";
    } catch (e) { this.loginError = e.message; }
  },
  async doLogout() { await this.api("POST", "/api/auth/logout"); this.authenticated = false; },
  async loadBaseData() {
    const [keys, upstreams, config] = await Promise.all([
      this.api("GET", "/api/keys").catch(() => []),
      this.api("GET", "/api/upstreams").catch(() => []),
      this.api("GET", "/api/config").catch(() => ({})),
    ]);
    this.keys = keys || []; this.upstreams = upstreams || [];
    if (config) {
      this.activeKeyId = config.activeKeyId; this.activeUpstreamId = config.activeUpstreamId;
      this.activeLoadBalancing = config.loadBalancing;
      this.activeKeyName = (this.keys.find(k => k.id === this.activeKeyId) || {}).name || "";
      this.activeUpstreamName = (this.upstreams.find(u => u.id === this.activeUpstreamId) || {}).name || "";
    }
  },
  loadTab() {
    switch (this.tab) {
      case "dashboard": this.loadStats(); break;
      case "keys": case "upstreams": this.loadBaseData(); break;
      case "models": this.loadModels(); break;
      case "logs": this.loadLogs(); break;
    }
  },
  async loadStats() { try { this.stats = await this.api("GET", "/api/stats?period=" + this.statsPeriod) || this.stats; } catch {} },
  async loadModels() {
    this.loadingModels = true;
    try { const r = await this.api("GET", "/api/management-models"); this.models = r?.models || []; }
    catch (e) { this.toastMsg("加载模型失败: " + e.message, "error"); }
    this.loadingModels = false;
  },
  async loadLogs() {
    const p = new URLSearchParams();
    if (this.logFilter.model) p.set("model", this.logFilter.model);
    if (this.logFilter.status) p.set("status", this.logFilter.status);
    p.set("page", String(this.logPage)); p.set("limit", "50");
    try { this.logData = await this.api("GET", "/api/logs?" + p.toString()) || this.logData; } catch {}
  },
  openKeyModal(k) {
    this.editingKey = k || null;
    this.keyForm = k ? { name: k.name, key: "", upstreamId: k.upstreamId, notes: k.notes } : { name: "", key: "", upstreamId: "", notes: "" };
    this.showKeyModal = true;
  },
  async saveKey() {
    if (!this.keyForm.name) return this.toastMsg("名称不能为空", "error");
    if (!this.editingKey && !this.keyForm.key) return this.toastMsg("密钥值不能为空", "error");
    try {
      this.editingKey ? await this.api("PUT", "/api/keys/" + this.editingKey.id, this.keyForm) : await this.api("POST", "/api/keys", this.keyForm);
      this.showKeyModal = false; await this.loadBaseData(); this.toastMsg("保存成功", "success");
    } catch (e) { this.toastMsg(e.message, "error"); }
  },
  async deleteKey(id) { if (!confirm("确定删除此密钥？")) return; try { await this.api("DELETE", "/api/keys/" + id); await this.loadBaseData(); this.toastMsg("已删除", "success"); } catch (e) { this.toastMsg(e.message, "error"); } },
  async setDefaultKey(id) { try { await this.api("POST", "/api/keys/" + id + "/set-default"); await this.loadBaseData(); this.toastMsg("已设为默认", "success"); } catch (e) { this.toastMsg(e.message, "error"); } },
  openUpstreamModal(u) { this.editingUpstream = u || null; this.upstreamForm = u ? { name: u.name, url: u.url, keyId: u.keyId || "" } : { name: "", url: "", keyId: "" }; this.showUpstreamModal = true; },
  async saveUpstream() {
    if (!this.upstreamForm.name || !this.upstreamForm.url) return this.toastMsg("名称和地址不能为空", "error");
    try {
      this.editingUpstream ? await this.api("PUT", "/api/upstreams/" + this.editingUpstream.id, this.upstreamForm) : await this.api("POST", "/api/upstreams", this.upstreamForm);
      this.showUpstreamModal = false; await this.loadBaseData(); this.toastMsg("保存成功", "success");
    } catch (e) { this.toastMsg(e.message, "error"); }
  },
  async deleteUpstream(id) { if (!confirm("确定删除此上游？")) return; try { await this.api("DELETE", "/api/upstreams/" + id); await this.loadBaseData(); this.toastMsg("已删除", "success"); } catch (e) { this.toastMsg(e.message, "error"); } },
  async activateUpstream(id) { try { await this.api("POST", "/api/upstreams/" + id + "/activate"); await this.loadBaseData(); this.toastMsg("已启用", "success"); } catch (e) { this.toastMsg(e.message, "error"); } },
  async testUpstream(id) {
    this.upstreamStatus[id] = { ok: false, error: "检测中..." };
    try {
      const r = await this.api("POST", "/api/upstreams/" + id + "/test");
      this.upstreamStatus[id] = r;
      this.toastMsg(r.ok ? `在线 — ${r.models?.length || 0} 个模型` : "离线: " + (r.error || "未知"), r.ok ? "success" : "error");
    } catch (e) { this.upstreamStatus[id] = { ok: false, error: e.message }; }
  },
  get filteredModels() {
    if (!this.modelFilter) return this.models;
    const q = this.modelFilter.toLowerCase();
    return this.models.filter(m => m.id.toLowerCase().includes(q) || (m.ownedBy || "").toLowerCase().includes(q));
  },
  fmtNum(n) { if (!n && n !== 0) return "0"; return n.toLocaleString(); },
  fmtTs(ts) { try { return new Date(ts).toLocaleString("zh-CN"); } catch { return ts; } },
  toastMsg(msg, type) { this.toast = { show: true, msg, type }; setTimeout(() => this.toast.show = false, 3000); },
};}</script>
</body>
</html>
